plugins {
    id 'com.android.application'
}

android {
    namespace 'com.erasercn.ipplease'
    compileSdk 34

    defaultConfig {
        applicationId "com.erasercn.ipplease"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
